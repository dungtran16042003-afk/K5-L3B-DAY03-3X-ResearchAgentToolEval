# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng khi thiếu thông tin (thiếu handle, URL, chủ đề). LUÔN truyền response_type - 'text' cho câu hỏi mở, 'yes_no' khi xin xác nhận trước một hành động."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi text lên Telegram. CHỈ gọi khi người dùng ĐÃ xác nhận rõ ràng (confirmed=true). Chưa xác nhận thì KHÔNG gọi send - hãy gọi clarify(response_type='yes_no') để xin xác nhận trước."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
  # ---------------- Team tools (CP3) ----------------
  - name: feedback_analyzer
    description: "Phân tích cảm xúc một đoạn phản hồi tiếng Việt: positive/negative/neutral, kèm các điểm khen và điểm chê tìm được (hiểu cả gõ có dấu và không dấu). Dùng khi user đưa sẵn một đoạn text phản hồi/đánh giá và muốn biết khách hài lòng hay không. KHÔNG dùng để tìm bài đăng trên mạng xã hội (dùng social_search), đọc URL (dùng fetch) hay tra cứu thông tin (dùng lookup); tool chỉ nhận text nằm ngay trong args."
    parameters:
      type: object
      properties:
        feedback:
          type: string
          description: "Đoạn phản hồi tiếng Việt cần phân tích, text đầy đủ"
      required: [feedback]

  - name: summarize_text
    description: "Tóm tắt rút trích (extractive) một đoạn văn tiếng Việt: chọn tối đa max_sentences câu quan trọng nhất theo tần suất từ, giữ thứ tự và nguyên văn câu gốc (không bịa lời mới). Dùng khi có văn bản dài (kết quả fetch, bài báo, phản hồi) cần rút gọn trước khi trình bày. KHÔNG dùng để tìm thông tin mới (dùng lookup/social_search) hay trích từ khóa chủ đề (dùng keyword_extractor)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Đoạn văn cần tóm tắt"}
        max_sentences: {type: integer, default: 3, description: "Số câu nhiều nhất được giữ lại (nguyên >= 1)"}
      required: [text]

  - name: keyword_extractor
    description: "Trích xuất top_k từ khóa hay gặp nhất trong một đoạn văn tiếng Việt/Anh (đã bỏ stopword và số), kèm số lần xuất hiện. Dùng khi cần biết chủ đề chính của text đã có sẵn (bài fetch về, phản hồi, transcript). KHÔNG dùng để tìm bài đăng (dùng social_search), đọc URL (dùng fetch) hay tóm tắt thành đoạn văn (dùng summarize_text)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Đoạn văn cần trích từ khóa"}
        top_k: {type: integer, default: 5, description: "Số từ khóa trả về (nguyên >= 1)"}
      required: [text]

  - name: hashtag_suggester
    description: "Đề xuất tối đa max_tags hashtag không dấu, viết hoa chữ cái đầu (ví dụ 'dữ liệu' thành #Du #Lieu), dựa trên các từ khóa chính của đoạn text. Dùng khi chuẩn bị đăng digest/bài đăng lên mạng xã hội, thường gọi trước send. KHÔNG dùng để phân tích cảm xúc khách hàng (dùng feedback_analyzer) hay tạo nội dung mới (dùng lookup/summarize_text)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Đoạn văn làm nguồn đề xuất hashtag"}
        max_tags: {type: integer, default: 3, description: "Số hashtag nhiều nhất (nguyên >= 1)"}
      required: [text]